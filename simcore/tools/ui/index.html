<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中世紀家族試玩</title>
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #2b2620; --muted: #7a7064; --line: #e2dbcf;
  --accent: #8a5a2b; --accent-soft: #f3e6d6; --good: #2f7d4f; --bad: #b23b3b; --warn: #b07a12;
  --news: #2d5e9e; --whisper: #7b4f9e; --history: #6b5a3a; --btn: #efe7da; --btn-hover: #e6dac6;
  --map-field: #ebe3cf; --map-river: #8fb3d1; --map-meadow: #c5dba6; --map-common: #dcd6b4; --map-wood: #7f9c68; --map-village: #e2d2b4; --map-lord: #a9a398; --map-waste: #e3dcc2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1b18; --panel: #26231f; --ink: #ece6dc; --muted: #a3998b; --line: #3a352e;
    --accent: #d9a46b; --accent-soft: #3a2e22; --good: #6cc48f; --bad: #e87b7b; --warn: #e2b04f;
    --news: #82aee8; --whisper: #c39ae6; --history: #cdb88f; --btn: #332e28; --btn-hover: #3e382f;
    --map-field: #3a362d; --map-river: #34506a; --map-meadow: #3c4a30; --map-common: #444032; --map-wood: #2f4128; --map-village: #4a4031; --map-lord: #6e6960; --map-waste: #3d3a30;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
header h1 { font-size: 18px; margin: 0; }
.stat { color: var(--muted); }
.stat b { color: var(--ink); font-weight: 600; }
.lean { color: var(--bad); font-weight: 600; }
main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(360px, 1.35fr) minmax(320px, 1.15fr); gap: 14px; padding: 14px 16px 40px; align-items: start; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr 1fr; } #col-mid { grid-column: 1 / -1; order: -1; } }
@media (max-width: 720px) { main { grid-template-columns: 1fr; } }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
section.panel h2 { font-size: 15px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
section.panel h2 small { font-weight: normal; color: var(--muted); font-size: 12px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-bottom: 9px; }
.card.wants { border-color: var(--accent); background: var(--accent-soft); }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.card .name { font-weight: 600; font-size: 15px; }
.card .sub { color: var(--muted); font-size: 12px; }
.mood { font-size: 13px; }
.want { color: var(--accent); font-weight: 600; margin: 3px 0; }
.station { font-size: 13px; margin: 2px 0; }
.card.away { opacity: 0.85; border-style: dashed; }
.op { font-size: 13px; cursor: pointer; }
.op .reasons { display: none; color: var(--muted); font-size: 12px; margin-top: 2px; }
.op.open .reasons { display: block; }
.pos { color: var(--good); } .neg { color: var(--bad); }
.needs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 6px 0 2px; }
.need { font-size: 11px; color: var(--muted); }
.need .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 1px; }
.need .bar i { display: block; height: 100%; background: var(--good); }
.need .bar i.low { background: var(--bad); } .need .bar i.mid { background: var(--warn); }
.traits { font-size: 12px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
button { font: inherit; color: var(--ink); background: var(--btn); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; }
button:hover:not(:disabled) { background: var(--btn-hover); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
button.wanted { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
button.link { background: none; border: none; color: var(--accent); padding: 0 2px; }
.ask { border: 2px solid var(--accent); }
.ask .situation { font-size: 15px; margin: 4px 0 10px; }
.ask .opts { display: flex; flex-direction: column; gap: 6px; }
.ask .opts button { text-align: left; padding: 8px 11px; }
.ask .closed { color: var(--muted); font-size: 12px; margin-top: 6px; }
.running { color: var(--muted); font-style: italic; }
.turnbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.summary { white-space: pre-wrap; font-size: 13px; }
.feed { max-height: 560px; overflow: auto; }
.feed .yr { color: var(--muted); font-size: 12px; margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 4px; }
.feed .ln { padding: 2px 0; }
.feed .ln.news { color: var(--news); } .feed .ln.wide { color: var(--warn); } .feed .ln.history { color: var(--history); font-weight: 600; }
.feed .ln.event { font-weight: 600; } .feed .ln.fresh { background: var(--accent-soft); border-radius: 4px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.talk .item { padding: 5px 0; border-bottom: 1px solid var(--line); }
.talk .item.whisper { color: var(--whisper); }
.talk .item.old { opacity: .6; }
.talk .who { color: var(--muted); font-size: 12px; }
.person { padding: 7px 0; border-bottom: 1px solid var(--line); }
.person .top { display: flex; justify-content: space-between; gap: 6px; }
.busy { color: var(--accent); }
svg text { fill: var(--ink); font-size: 12px; }
svg .center text { font-weight: 700; }
.mz { fill: var(--map-field); } .mz.river { fill: var(--map-river); } .mz.meadow { fill: var(--map-meadow); } .mz.common { fill: var(--map-common); }
.mz.wood { fill: var(--map-wood); } .mz.waste { fill: var(--map-waste); } .mz.village { fill: var(--map-village); }
.parcel.dim { opacity: .28; } .medge { stroke: var(--panel); stroke-width: 1; fill: none; }
.mlabel { font-size: 11px; fill: var(--ink); opacity: .55; pointer-events: none; font-weight: 600; }
.mhome { stroke: var(--ink); stroke-width: .8; } .mhome.on { stroke-width: 2.2; }
svg text.mhname { font-size: 7px; font-weight: 700; pointer-events: none; paint-order: stroke; stroke: var(--map-village); stroke-width: 2.5px; }
.mapwrap { position: relative; } .mapwrap:not(.big) .mpoin { display: none; }
.mapzoom { position: absolute; right: 4px; top: 4px; font-size: 12px; padding: 1px 8px; z-index: 1; }
.mapwrap.big { position: fixed; inset: 12px; z-index: 20; background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 34px 14px 14px; overflow: auto;
  display: grid; grid-template-columns: minmax(0, 2.6fr) minmax(260px, 1fr); gap: 14px; align-content: start; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
@media (max-width: 900px) { .mapwrap.big { grid-template-columns: 1fr; } }
.mpoi { fill: var(--panel); stroke: var(--ink); stroke-width: 1; } svg text.mpoig { font-size: 8px; font-weight: 700; pointer-events: none; }
svg text.mpoin { font-size: 7.5px; font-weight: 600; pointer-events: none; paint-order: stroke; stroke: var(--map-village); stroke-width: 2.5px; }
.mvac { fill: var(--map-field); } .mvacl { stroke: var(--muted); stroke-width: 1.4; }
.mlegend { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
.mlegend .mrow { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; font-size: 12px; }
.mlegend .mrow.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.mlegend .mrow:disabled { opacity: 1; cursor: default; }
.mlist { font-size: 13px; margin-top: 4px; }
.legend { font-size: 12px; color: var(--muted); }
.hdetail { margin-top: 8px; font-size: 13px; }
.drawer { position: fixed; right: 16px; bottom: 16px; width: min(520px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 14px; box-shadow: 0 8px 30px rgba(0,0,0,.25); display: none; z-index: 10; }
.drawer.show { display: block; }
.drawer pre { white-space: pre-wrap; font: inherit; margin: 0; }
.plan .card { cursor: default; }
.muted { color: var(--muted); }
.steps span { display: inline-block; margin-right: 6px; font-size: 12px; }
.steps .done { color: var(--good); }
.asks { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; align-items: center; }
.asks .lab { font-size: 12px; color: var(--muted); }
.asks button { border-style: dashed; }
.favour { font-size: 12px; color: var(--muted); }
.answer { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-top: 10px; }
.answer.yes { border-color: var(--good); } .answer.cond { border-color: var(--warn); } .answer.no { border-color: var(--bad); }
.answer .verdict { font-weight: 600; }
.contest .item { padding: 7px 0; border-bottom: 1px solid var(--line); }
.contest .item.mine { background: var(--accent-soft); border-radius: 6px; padding: 7px 8px; }
.contest .thing { font-weight: 600; }
.contest .who { font-size: 13px; }
.contest h3 { font-size: 13px; margin: 12px 0 4px; color: var(--muted); }
.mwant { fill: none; stroke: var(--bad); stroke-width: 1.6; stroke-dasharray: 3 2; pointer-events: none; }
</style>
</head>
<body>
<header id="top"><h1>載入中…</h1></header>
<main>
  <div id="col-left">
    <section class="panel"><h2>家裡 <small id="timeleft"></small></h2><div id="family"></div></section>
  </div>
  <div id="col-mid">
    <section class="panel" id="turn"></section>
    <section class="panel" id="summary-panel" style="display:none"><h2>上一季</h2><div class="summary" id="summary"></div></section>
    <section class="panel"><h2>發生的事 <small>最新的在上面</small></h2><div class="feed" id="feed"></div></section>
  </div>
  <div id="col-right">
    <section class="panel">
      <div class="tabs" id="tabs"></div>
      <div id="tab-body"></div>
    </section>
  </div>
</main>
<div class="drawer" id="drawer"><div style="display:flex;justify-content:space-between;align-items:center"><b id="drawer-title"></b><button class="link" onclick="closeDrawer()">關閉</button></div><pre id="drawer-text"></pre></div>
<script>
const NEEDS = ["吃飽", "歇息", "暖和", "人情", "心靈"];
let seq = -1, lineCount = 0, view = null, lines = [], tab = "talk", selectedHouse = null, openPlan = null, freshFrom = 0;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const signed = (v) => (v > 0 ? "+" : "") + v;
const cls = (v) => (v >= 10 ? "pos" : v <= -10 ? "neg" : "");
const opWord = (op) => op >= 60 ? "非常親近" : op >= 30 ? "有好感" : op >= 10 ? "還算友善" : op > -10 ? "沒什麼感覺" : op > -30 ? "不太喜歡" : op > -60 ? "厭惡" : "恨之入骨";

async function poll() {
  for (;;) {
    try {
      const r = await fetch(`/api/view?seq=${seq}&line=${lineCount}`);
      const v = await r.json();
      if (v.seq !== seq) {
        freshFrom = lines.length;
        lines = lines.concat(v.lines || []);
        lineCount = v.line_count;
        seq = v.seq;
        view = v;
        render();
      }
    } catch (e) {
      $("turn").innerHTML = `<p class="running">連不上遊戲（關掉了嗎？）。重新執行 scripts/ui.sh 再開。</p>`;
      await new Promise((ok) => setTimeout(ok, 3000));
    }
  }
}

async function act(obj) {
  view.ask = null;
  renderTurn();
  renderFamily();
  await fetch("/api/act", { method: "POST", body: JSON.stringify(obj) });
}
async function look(obj, title) {
  const r = await fetch("/api/look", { method: "POST", body: JSON.stringify(obj) });
  const v = await r.json();
  $("drawer-title").textContent = title;
  $("drawer-text").textContent = v.text || "（沒有回應）";
  $("drawer").classList.add("show");
}
function closeDrawer() { $("drawer").classList.remove("show"); }

const seasonOpen = () => view && view.ask && view.ask.kind === "season";

function render() {
  renderTop();
  renderTurn();
  renderFamily();
  renderFeed();
  renderTabs();
}

function renderTop() {
  const s = view.state;
  if (!s || !s.house) { $("top").innerHTML = "<h1>載入中…</h1>"; return; }
  const h = s.house;
  let amb = "";
  if (s.ambition) {
    const steps = s.ambition.steps.map((x) => `<span class="${x.done ? "done" : ""}">${x.done ? "✓" : "○"} ${esc(x.name)}</span>`).join("");
    amb = `<span class="stat" title="${esc(s.ambition.desc)}">志向 <b>${esc(s.ambition.name)}</b> <span class="steps">${steps}</span></span>`;
  }
  $("top").innerHTML = `<h1>${esc(h.surname)}家</h1>
    <span class="stat"><b>${s.date.year}</b> 年 ${esc(s.date.season)}</span>
    <span class="stat">地位 <b>${esc(h.standing)}</b></span>
    <span class="stat">錢 <b>${h.money}</b> 便士</span>
    <span class="stat">存糧 <b>${h.food_days}</b> 天${h.lean ? ' <span class="lean">今年缺糧</span>' : ""}</span>
    <span class="stat">地 <b>${h.acres}</b> 畝${h.freehold > 0 ? `（自由地 ${h.freehold}）` : ""}</span>
    ${h.debt > 0 ? `<span class="stat lean">欠債 ${h.debt} 便士</span>` : ""}
    ${s.contest && s.contest.fine ? `<span class="stat lean" title="家主過世，繼承要付給領主的入地費">入地費 ${s.contest.fine.amount} 便士，${s.contest.fine.year} 年 ${s.contest.fine.month} 月前${s.contest.fine.extended ? "（已寬限過）" : ""}</span>` : ""}
    ${amb}`;
  $("timeleft").textContent = seasonOpen() ? `這一季還有 ${s.time_left} 段空閒` : "";
}

function renderTurn() {
  const s = view.state, a = view.ask;
  let html = "";
  if (view.ended) {
    html = `<h2>結束</h2><p>${view.ended.crashed ? "遊戲程式停了。" : view.ended.line_ended ? `${view.ended.year} 年，家族斷絕了。` : `玩到了 ${view.ended.year} 年。`}記錄存在這一局的資料夾裡（log.md）。</p>`;
    $("turn").className = "panel";
  } else if (a && a.kind === "choice") {
    $("turn").className = "panel ask";
    html = `<h2>〔${esc(a.title)}〕<small>${s ? `${s.date.year} 年 ${s.date.month} 月` : ""}</small></h2>
      <div class="situation">${esc(a.situation)}</div>
      <div class="opts">${a.options.map((o, i) => `<button onclick="act({do:'choose',index:${i}})">${i + 1}. ${esc(o)}</button>`).join("")}</div>
      ${a.unavailable.length ? `<div class="closed">${a.unavailable.map(esc).join("<br>")}</div>` : ""}
      <div style="margin-top:8px"><button class="link" onclick="act({do:'ai'})">讓 AI 替你決定</button></div>`;
  } else if (a && a.kind === "season") {
    $("turn").className = "panel ask";
    html = `<h2>${s.date.year} 年 ${esc(s.date.season)} <small>還有 ${s.time_left} 段空閒</small></h2>
      <p class="muted" style="margin:0 0 8px">找家人或村民（左邊、右邊的按鈕）各用一段空閒，定計畫也用一段；沒用完的拿去下田，收成會好一點。</p>
      <div class="turnbar">
        <button class="primary" onclick="act({do:'pass'})">過這一季</button>
        <button onclick="act({do:'year'})">一口氣過一年</button>
        <button onclick="look({do:'report'}, '家裡知道的事')">家裡知道什麼</button>
        <button class="link" onclick="if(confirm('結束這一局？'))act({do:'quit'})">結束這一局</button>
      </div>${answerCard(s)}`;
  } else {
    $("turn").className = "panel";
    html = `<p class="running">日子在過……</p>`;
  }
  $("turn").innerHTML = html;
  const sum = s && s.summary ? s.summary.trim() : "";
  $("summary-panel").style.display = sum ? "" : "none";
  $("summary").textContent = sum;
}

function needBars(needs) {
  return `<div class="needs">${needs.map((v, i) => `<div class="need">${NEEDS[i]}<div class="bar"><i class="${v < 30 ? "low" : v < 55 ? "mid" : ""}" style="width:${v}%"></i></div></div>`).join("")}</div>`;
}
function actionButtons(p) {
  if (!p.actions || !p.actions.length) return "";
  const can = seasonOpen();
  return `<div class="actions">${p.actions.map((x) => {
    const tip = x.open ? (x.desc || "") + (x.money ? `（${x.money} 便士）` : "") : x.why;
    return `<button ${x.open && can ? "" : "disabled"} class="${x.wanted ? "wanted" : ""}" title="${esc(tip)}" onclick="act({do:'interact',who:${p.id},event:'${x.event}'})">${x.wanted ? "★ " : ""}${esc(x.title)}</button>`;
  }).join("")}</div>`;
}
// 開口: ask someone for a thing. Same buttons for a follow-up, with a lever on top.
const LEVERS = { gift: "送點禮再說", favour: "提他欠的人情", hook: "拿把柄壓他", meet: "答應他的條件" };
const ANSWER = { 1: ["yes", "答應了"], 2: ["cond", "有條件"], 3: ["no", "不肯"], 4: ["no", "惱了"] };
function askCall(who, a, lever) {
  return `act({do:'ask',who:${who},ask:'${a.ask}',object:${a.object},subject:${a.subject},office:'${esc(a.office || "")}',lever:'${lever || ""}'})`;
}
let askMore = new Set();
function askButtons(p) {
  const f = (p.owes > 0 ? `<span class="favour">欠你家人情 ${p.owes}</span> ` : "") + (p.owed > 0 ? `<span class="favour">你家欠他 ${p.owed}</span>` : "");
  if (!p.asks || !p.asks.length) return f ? `<div>${f}</div>` : "";
  const can = seasonOpen();
  // Someone holding many parcels: one land ask shown, the rest behind a toggle.
  const land = p.asks.filter((a) => a.ask === "sell_parcel");
  const hidden = askMore.has(p.id) ? [] : land.slice(1);
  const shown = p.asks.filter((a) => !hidden.includes(a));
  const more = hidden.length ? `<button class="link" onclick="askMore.add(${p.id});renderTabs()">還有 ${hidden.length} 塊地…</button>` : "";
  return `<div class="asks"><span class="lab">開口：</span>${shown.map((a) =>
    `<button ${a.open && can ? "" : "disabled"} title="${esc(a.open ? "用一段空閒去問" : a.why)}" onclick="${askCall(p.id, a, "")}">${esc(a.label)}</button>`).join("")}${more}${f ? " " + f : ""}</div>`;
}
function answerCard(s) {
  const a = s && s.last_ask;
  if (!a) return "";
  const [k, word] = ANSWER[a.answer] || ["", ""];
  const more = a.answer >= 2 && a.levers.length && seasonOpen()
    ? `<div class="actions">${a.levers.map((l) => `<button onclick="${askCall(a.who, a, l)}">${esc(LEVERS[l] || l)}</button>`).join("")}</div>` : "";
  return `<div class="answer ${k}"><span class="verdict">${esc(a.name)}：${word}</span><div>${esc(a.text)}</div>${more}</div>`;
}
function reasonsLine(rs) {
  return rs && rs.length ? rs.map(([l, v]) => `${esc(l)} <span class="${cls(v)}">${signed(v)}</span>`).join("、") : "沒有特別的原因";
}
function toggle(el) { el.classList.toggle("open"); }

function renderFamily() {
  const s = view.state;
  if (!s || !s.family) return;
  $("family").innerHTML = s.family.map((p) => {
    const me = p.id === s.head;
    return `<div class="card ${p.want ? "wants" : ""}">
      <div class="top"><span class="name">${me ? "你　" : ""}${esc(p.name)}</span><span class="sub">${esc(me ? "" : p.kin)} ${p.age} 歲${p.health < 40 ? ' <span class="neg">身體很差</span>' : ""}</span></div>
      ${p.station ? `<div class="station">${esc(p.station)}</div>` : ""}
      <div class="mood">${esc(p.mood)}${p.mood_cause ? "：" + esc(p.mood_cause) : ""}</div>
      ${p.want ? `<div class="want">${esc(p.want)}</div>` : ""}
      ${me ? "" : `<div class="op" onclick="toggle(this)">對你 <b class="${cls(p.opinion)}">${esc(p.opinion_word)} ${signed(p.opinion)}</b> <span class="muted">▾</span><div class="reasons">${reasonsLine(p.reasons)}</div></div>`}
      ${needBars(p.needs)}
      ${p.traits.length ? `<div class="traits">${p.traits.map(esc).join("、")}</div>` : ""}
      ${roadLine(p.road)}
      ${actionButtons(p)}
    </div>`;
  }).join("") + (s.away || []).map((p) => `<div class="card away">
      <div class="top"><span class="name">${esc(p.name)}</span><span class="sub">${esc(p.kin)} ${p.age} 歲</span></div>
      <div class="station">${esc(p.station)}</div>
      ${roadLine(p.road)}
    </div>`).join("");
}

// 人生路: the turns a life has taken, oldest first, folded away until clicked.
function roadLine(road) {
  if (!road || !road.length) return "";
  return `<div class="op" onclick="toggle(this)">人生路 <span class="muted">${road.length} 段 ▾</span><div class="reasons">${road.map((r) => `${r.year}　${esc(r.text)}`).join("<br>")}</div></div>`;
}

function lineClass(l) {
  if (l.kind === 3) return "history";
  if (l.text.startsWith("【消息】")) return "news";
  if (l.text.startsWith("【風聲】")) return "wide";
  if (l.text.startsWith("〔")) return "event";
  return "";
}
function renderFeed() {
  const show = lines.slice(-400);
  const start = lines.length - show.length;
  let html = "", year = null;
  for (let i = show.length - 1; i >= 0; --i) {
    const l = show[i];
    if (l.year !== year) { html += `<div class="yr">${l.year} 年</div>`; year = l.year; }
    html += `<div class="ln ${lineClass(l)} ${start + i >= freshFrom ? "fresh" : ""}">${esc(l.text)}</div>`;
  }
  $("feed").innerHTML = html || '<p class="muted">還沒有事。</p>';
}

const TABS = [["talk", "村裡在說"], ["contest", "在爭什麼"], ["map", "地圖"], ["net", "關係網"], ["people", "村民"], ["plans", "計畫"]];
function renderTabs() {
  $("tabs").innerHTML = TABS.map(([k, n]) => `<button class="${tab === k ? "on" : ""}" onclick="tab='${k}';renderTabs()">${n}</button>`).join("");
  const s = view.state;
  if (!s || !s.family) { $("tab-body").innerHTML = ""; return; }
  if (tab === "talk") renderTalk(s);
  else if (tab === "net") renderNet(s);
  else if (tab === "map") renderMap(s);
  else if (tab === "people") renderPeople(s);
  else if (tab === "contest") renderContest(s);
  else renderPlans(s);
}

function renderTalk(s) {
  const items = s.heard || [];
  $("tab-body").innerHTML = items.length ? `<div class="talk">${items.map((h) => `<div class="item ${h.whisper ? "whisper" : ""} ${h.recent ? "" : "old"}">
      <div class="who">${h.year} 年　${h.whisper ? (h.teller ? esc(h.teller) + "悄悄說（不知真假）" : "有人悄悄說") : h.teller ? "聽" + esc(h.teller) + "說" : ""}</div>
      ${esc(h.text)}</div>`).join("")}</div>` : '<p class="muted">還沒聽到什麼。</p>';
}

function houseDetail(sel) {
  return `<div class="hdetail"><b>${esc(sel.surname)}家</b>　${sel.acres} 畝　兩家 ${Math.round(sel.link * 100)} 分近${sel.feud ? `　<span class="neg">${["", "有嫌隙", "結了怨", "世仇"][sel.feud]}</span>` : ""}
      <div class="muted">${esc(sel.tie)}</div>
      <div>${sel.members.map((m) => `<span style="display:inline-block;margin-right:10px">${m.head ? "（家主）" : ""}<button class="link" onclick="look({do:'inspect',who:${m.id}}, '${esc(m.name)}')">${esc(m.name)}</button> ${m.age} 歲 <span class="${cls(m.opinion)}">${opWord(m.opinion)}</span></span>`).join("")}</div></div>`;
}

// The village from above: every parcel coloured by the house that holds it, the shared ground, the landmarks.
const MAP_POI = { church: "✝", manor: "♜", green: "♣", alehouse: "酒", well: "◎", mill: "磨", pound: "欄", cross: "✚" };
// Muted colours far apart from each other; a house keeps its colour while the set of houses stays the same.
const MAP_COLORS = ["#c9876b", "#7fa6c6", "#d4b55f", "#8fb58a", "#b58cc0", "#e09a9a", "#6fb3a8", "#c7a27f", "#9a9ad6", "#b8c46e", "#d68fb8", "#86c0d9", "#c9a0a0", "#a8b8a0"];
let mapColor = new Map();
function houseColor(id) { return mapColor.get(id) || `hsl(${Math.round((id * 137.508) % 360)} 40% 62%)`; }
let mapBig = false;
function parcelFill(p) {
  if (p.mine) return "var(--accent)";
  if (p.lord) return "var(--map-lord)";
  if (p.house < 0) return "url(#vacant)";
  return houseColor(p.house);
}
// How the parcel came to its holder; land held since before the game began just says how.
function parcelSince(p) { return p.how === "祖傳" || p.how === "領主自營" || p.how === "沒人租" ? p.how : `${p.since} 年${p.how || "到手"}`; }
function renderMap(s) {
  const m = s.map;
  if (!m) { $("tab-body").innerHTML = '<p class="muted">沒有地圖。</p>'; return; }
  const C = 12, W = m.w * C, H = m.h * C;
  const sel = selectedHouse;
  const ids = [...new Set([...m.parcels.filter((p) => p.house >= 0 && !p.mine && !p.lord).map((p) => p.house), ...m.homes.filter((h) => !h.mine && !h.lord).map((h) => h.house)])].sort((a, b) => a - b);
  mapColor = new Map(ids.map((id, i) => [id, MAP_COLORS[i % MAP_COLORS.length]]));
  let g = `<rect width="${W}" height="${H}" class="mz waste"/>`;
  for (const a of m.areas) {
    g += `<rect x="${a.x * C}" y="${a.y * C}" width="${a.w * C}" height="${a.h * C}" class="mz ${a.kind}"/>`;
  }
  // Parcels: one group per parcel so the tooltip covers all its strips.
  const byParcel = m.parcels.map(() => []);
  m.cells.forEach((pi, c) => { if (pi >= 0) byParcel[pi].push(c); });
  m.parcels.forEach((p, pi) => {
    const dim = sel != null && p.house !== sel && !(sel === -2 && p.mine);
    const tip = `${p.name}${p.free ? "（自由地）" : ""}\n${p.house < 0 ? "沒人租，在領主手上" : p.lord ? "領主自營" : p.mine ? "你家的" : p.holder + "家的"}　${parcelSince(p)}${p.wanted && p.wanted.length ? `\n想要這塊的：${p.wanted.join("、")}` : ""}`;
    g += `<g class="parcel${dim ? " dim" : ""}" ${p.house >= 0 && !p.lord ? `onclick="selectedHouse=${p.mine ? -2 : p.house};renderTabs()" style="cursor:pointer"` : ""}><title>${esc(tip)}</title>${byParcel[pi].map((c) => `<rect x="${(c % m.w) * C}" y="${Math.floor(c / m.w) * C}" width="${C}" height="${C}" fill="${parcelFill(p)}"/>`).join("")}</g>`;
  });
  // Lines between different parcels, so neighbouring strips of one house still read as separate pieces.
  let edges = "";
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const a = m.cells[y * m.w + x];
    if (x + 1 < m.w) { const b = m.cells[y * m.w + x + 1]; if (a !== b && (a >= 0 || b >= 0)) edges += `M${(x + 1) * C} ${y * C}v${C}`; }
    if (y + 1 < m.h) { const b = m.cells[(y + 1) * m.w + x]; if (a !== b && (a >= 0 || b >= 0)) edges += `M${x * C} ${(y + 1) * C}h${C}`; }
  }
  g += `<path d="${edges}" class="medge"/>`;
  // Parcels the family knows someone is after: a dashed outline round the whole piece.
  let want = "";
  const wanted = (i) => i >= 0 && m.parcels[i].wanted && m.parcels[i].wanted.length;
  for (let y = 0; y < m.h; y++) for (let x = 0; x < m.w; x++) {
    const a = m.cells[y * m.w + x];
    if (!wanted(a)) continue;
    const at = (xx, yy) => (xx < 0 || yy < 0 || xx >= m.w || yy >= m.h ? -1 : m.cells[yy * m.w + xx]);
    if (at(x - 1, y) !== a) want += `M${x * C} ${y * C}v${C}`;
    if (at(x + 1, y) !== a) want += `M${(x + 1) * C} ${y * C}v${C}`;
    if (at(x, y - 1) !== a) want += `M${x * C} ${y * C}h${C}`;
    if (at(x, y + 1) !== a) want += `M${x * C} ${(y + 1) * C}h${C}`;
  }
  if (want) g += `<path d="${want}" class="mwant"/>`;
  for (const a of m.areas) {
    if (a.kind === "village") continue;
    g += `<text x="${(a.x + a.w / 2) * C}" y="${(a.y + a.h / 2) * C + 4}" text-anchor="middle" class="mlabel">${esc(a.name)}</text>`;
  }
  for (const h of m.homes) {
    if (h.lord) continue;
    const on = sel != null && (h.house === sel || (sel === -2 && h.mine));
    const x = h.x * C, y = h.y * C;
    g += `<g style="cursor:pointer" onclick="selectedHouse=${h.mine ? -2 : h.house};renderTabs()"><title>${esc(h.mine ? "你家" : h.name + "家")}</title>
      <rect x="${x + 2}" y="${y + 2}" width="${C - 4}" height="${C - 4}" rx="1.5" fill="${h.mine ? "var(--accent)" : houseColor(h.house)}" class="mhome${on ? " on" : ""}"/>
      ${h.mine ? `<text x="${x + C / 2}" y="${y + C + 8}" text-anchor="middle" class="mhname">你家</text>` : ""}</g>`;
  }
  for (const p of m.pois) {
    const x = p.x * C + C / 2, y = p.y * C + C / 2;
    g += `<g><title>${esc(p.name)}</title><circle cx="${x}" cy="${y}" r="${C * 0.62}" class="mpoi"/><text x="${x}" y="${y + 4}" text-anchor="middle" class="mpoig">${MAP_POI[p.kind] || "•"}</text>
      <text x="${x}" y="${y - C * 0.8}" text-anchor="middle" class="mpoin">${esc(p.name)}</text></g>`;
  }
  // Who holds how much: the houses' reach, largest first.
  const hold = new Map();
  for (const p of m.parcels) {
    const k = p.mine ? "mine" : p.lord ? "lord" : p.house < 0 ? "vacant" : p.house;
    const e = hold.get(k) || { k, name: p.mine ? "你家" : p.lord ? "領主自營" : p.house < 0 ? "沒人租" : p.holder + "家", acres: 0, n: 0, fill: parcelFill(p), house: p.mine ? -2 : p.house };
    e.acres += p.acres; e.n++;
    hold.set(k, e);
  }
  const rows = [...hold.values()].sort((a, b) => (a.k === "mine" ? -1 : b.k === "mine" ? 1 : b.acres - a.acres));
  const legend = rows.map((r) => {
    const click = r.k !== "lord" && r.k !== "vacant";
    return `<button class="mrow${sel != null && r.house === sel ? " on" : ""}" ${click ? `onclick="selectedHouse=${sel === r.house ? "null" : r.house};renderTabs()"` : "disabled"}>
      <svg width="14" height="14"><rect width="14" height="14" rx="2" fill="${r.fill}"/></svg> ${esc(r.name)} <span class="muted">${Math.round(r.acres)} 畝・${r.n} 塊</span></button>`;
  }).join("");
  const house = sel === -2 ? null : (s.houses || []).find((h) => h.id === sel);
  const mineRows = sel === -2 ? m.parcels.filter((p) => p.mine) : house ? m.parcels.filter((p) => p.house === sel) : [];
  const detail = sel == null ? '<p class="muted">點一塊地或一戶人家，看他家的地在哪裡。滑鼠停在地上看是哪一塊、怎麼來的。</p>'
    : (sel === -2 ? `<div class="hdetail"><b>你家</b></div>` : house ? houseDetail(house) : "")
      + `<div class="mlist">${mineRows.map((p) => `<div>${esc(p.name)}${p.free ? "・自由地" : ""}　<span class="muted">${esc(parcelSince(p))}</span></div>`).join("")}</div>`;
  $("tab-body").innerHTML = `<div class="mapwrap${mapBig ? " big" : ""}"><button class="mapzoom" onclick="mapBig=!mapBig;renderTabs()">${mapBig ? "收起" : "放大"}</button><svg viewBox="-2 -14 ${W + 4} ${H + 18}" width="100%" role="img" aria-label="村子地圖：每塊地是哪一家的">
      <defs><pattern id="vacant" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="mvac"/><line x1="0" y1="0" x2="0" y2="6" class="mvacl"/></pattern></defs>${g}</svg>
    <div class="mside"><div class="legend">三塊大田分成一條條，同一個顏色是同一家的地；你家是深色。斜線是沒人租、在領主手上的地。紅虛線框：你聽說有人想要的地。</div>
    <div class="mlegend">${legend}</div>${detail}</div>`;
}

function renderNet(s) {
  const hs = [...s.houses].sort((a, b) => b.link - a.link);
  const W = 460, H = 460, cx = W / 2, cy = H / 2;
  let edges = "", nodes = "";
  hs.forEach((h, i) => {
    const ang = (i / hs.length) * Math.PI * 2 - Math.PI / 2;
    const r = 55 + (1 - Math.min(1, h.link)) * 165;
    const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
    const color = h.attitude >= 15 ? "var(--good)" : h.attitude <= -10 ? "var(--bad)" : "var(--muted)";
    edges += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--accent)" stroke-opacity="${0.12 + h.link * 0.7}" stroke-width="${1 + h.link * 4}"/>`;
    const rad = 7 + Math.min(10, h.members.length * 1.3);
    nodes += `<g style="cursor:pointer" onclick="selectedHouse=${h.id};renderTabs()">
      ${h.feud ? `<circle cx="${x}" cy="${y}" r="${rad + 5}" fill="none" stroke="var(--bad)" stroke-dasharray="3 3" stroke-width="2"/>` : ""}
      <circle cx="${x}" cy="${y}" r="${rad}" fill="${color}" fill-opacity="${selectedHouse === h.id ? 1 : 0.75}" stroke="${selectedHouse === h.id ? "var(--ink)" : "none"}" stroke-width="2"/>
      <text x="${x}" y="${y + rad + 13}" text-anchor="middle">${esc(h.surname)}</text></g>`;
  });
  const sel = hs.find((h) => h.id === selectedHouse);
  const detail = sel ? houseDetail(sel) : '<p class="muted">點一戶人家看是誰、怎麼認識的。</p>';
  $("tab-body").innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="各戶跟你家多近">${edges}
      <g class="center"><circle cx="${cx}" cy="${cy}" r="20" fill="var(--accent)"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" style="fill:#fff">你家</text></g>${nodes}</svg>
    <div class="legend">越靠近中間，兩家越近（親戚、常來往）。綠：對你家有好感；紅：對你家不好；虛線紅圈：有仇。</div>${detail}`;
}

function renderPeople(s) {
  const ppl = s.people || [];
  $("tab-body").innerHTML = ppl.length ? ppl.map((p) => `<div class="person">
      <div class="top"><span><b>${p.busy ? '<span class="busy" title="跟你家有事">★</span> ' : ""}${esc(p.name)}</b> <span class="muted">${esc(p.familiarity)}${p.house ? "・" + esc(p.house) + "家" : ""}・${p.age} 歲</span></span>
      <button class="link" onclick="look({do:'inspect',who:${p.id}}, '${esc(p.name)}')">詳情</button></div>
      <div class="op" onclick="toggle(this)">對你 <b class="${cls(p.opinion)}">${esc(p.opinion_word)} ${signed(p.opinion)}</b>　你對他們 <span class="${cls(p.yours)}">${signed(p.yours)}</span>${p.feud ? `　<span class="neg">${["", "嫌隙", "結怨", "世仇"][p.feud]}</span>` : ""} <span class="muted">▾</span><div class="reasons">${reasonsLine(p.reasons)}</div></div>
      <div class="muted" style="font-size:12px">${esc(p.line)}</div>
      ${actionButtons(p)}${askButtons(p)}</div>`).join("") : '<p class="muted">眼下沒有誰跟你家特別有關係。</p>';
}

// 村裡在爭什麼: the things more than one house is after, as far as the family has heard.
const WANT_KIND = { parcel: "地", office: "差事", match: "親事", place: "名額" };
function renderContest(s) {
  const c = s.contest || { items: [], past: [], offices: [] };
  const can = seasonOpen();
  let html = "";
  if (c.fine) html += `<div class="card wants"><b>入地費 ${c.fine.amount} 便士</b>，${c.fine.year} 年 ${c.fine.month} 月前要交給領主。交不出來要借、去求領主寬限，或讓出一塊地。</div>`;
  const items = [...c.items].sort((a, b) => (b.mine >= 0) - (a.mine >= 0) || b.ours - a.ours || b.contested - a.contested || b.wanters.length - a.wanters.length);
  html += items.length ? `<div class="contest">${items.map((it, i) => {
    const head = i === 0 || (items[i - 1].contested || items[i - 1].mine >= 0 || items[i - 1].ours) !== (it.contested || it.mine >= 0 || it.ours)
      ? (it.contested || it.mine >= 0 || it.ours ? "" : `<h3>還聽說誰家在打什麼主意</h3>`) : "";
    const mine = it.mine >= 0;
    const who = it.wanters.map((x) => `<b>${esc(x.house)}</b>${x.for ? `（替${esc(x.for)}）` : ""}${x.mine && x.why ? `<span class="muted">：${esc(x.why)}</span>` : ""} <span class="muted">${x.since} 年起</span>`).join("<br>");
    const btn = mine ? `<button ${can ? "" : "disabled"} onclick="act({do:'want',what:'drop',object:${it.mine}})">不要了</button>`
      : it.kind === "parcel" && !it.ours ? `<button ${can ? "" : "disabled"} onclick="act({do:'want',what:'parcel',object:${it.parcel}})">我家也想要</button>` : "";
    return head + `<div class="item${mine ? " mine" : ""}"><div class="top" style="display:flex;justify-content:space-between;gap:6px"><span><span class="muted">${WANT_KIND[it.kind] || ""}</span> <span class="thing">${esc(it.thing)}</span>${it.contested ? ' <span class="neg" style="font-size:12px">撞上了</span>' : ""}</span>${btn}</div>
      <div class="muted" style="font-size:12px">${esc(it.holder)}${it.ours && !mine ? "　<span class=\"neg\">有人在打你家的主意</span>" : ""}</div>
      <div class="who">${who}</div></div>`;
  }).join("")}</div>` : '<p class="muted">還沒聽說村裡有誰在爭什麼。</p>';
  html += `<h3>村裡的差事</h3>` + c.offices.map((o) => `<div class="item" style="display:flex;justify-content:space-between;gap:6px;padding:4px 0">
      <span><b>${esc(o.name)}</b>　${o.mine ? '<span class="pos">你家的人</span> ' : ""}${o.holder ? esc(o.holder) : '<span class="muted">空著</span>'}</span>
      ${o.wanted ? '<span class="muted">你家想當</span>' : o.can && !o.mine ? `<button ${can ? "" : "disabled"} onclick="act({do:'want',what:'office:${o.id}',object:-1})">想當</button>` : ""}</div>`).join("");
  if (c.past.length) html += `<h3>你家最近的結果</h3>` + c.past.map((p) => `<div style="font-size:13px">${p.year} 年　${esc(p.thing)}：<b>${esc(p.outcome)}</b></div>`).join("");
  html += `<p class="legend">只列你家聽說的。去「村民」那一欄找人開口：買地、租地、請他投票、借錢、說親、收學徒。</p>`;
  $("tab-body").innerHTML = html;
}

function renderPlans(s) {
  let html = "";
  if (s.plan) {
    html += `<div class="card"><b>正在進行：${esc(s.plan.name)}</b>${s.plan.target ? "（對象 " + esc(s.plan.target) + "）" : ""}<div class="needs" style="grid-template-columns:1fr"><div class="need">進度 ${s.plan.progress}/100<div class="bar"><i style="width:${Math.max(0, Math.min(100, s.plan.progress))}%"></i></div></div></div>
      <button ${seasonOpen() ? "" : "disabled"} onclick="if(confirm('放棄這個計畫？'))act({do:'cancel'})">放棄</button></div>`;
  }
  const plans = s.plans || [];
  if (!s.plan && !plans.length) html += '<p class="muted">這時候不能定計畫。</p>';
  const sorted = [...plans].sort((a, b) => (b.ambition - a.ambition) || (b.open - a.open));
  html += sorted.map((p) => {
    const open = p.open && seasonOpen();
    const expanded = openPlan === p.id && open;
    return `<div class="card">
      <div class="top"><span class="name">${p.ambition ? "★ " : ""}${esc(p.name)}</span>${p.open ? `<button ${open ? "" : "disabled"} onclick="openPlan=openPlan==='${p.id}'?null:'${p.id}';renderTabs()">${expanded ? "收起" : "選對象"}</button>` : '<span class="muted">現在不行</span>'}</div>
      <div class="sub">${esc(p.desc)}</div>
      ${!p.open && p.needs ? `<div class="muted" style="font-size:12px">要：${esc(p.needs)}</div>` : ""}
      ${expanded ? `<div class="actions" style="flex-direction:column;align-items:stretch">${p.targets.map((t) => `<button style="text-align:left" onclick="openPlan=null;act({do:'plan',plan:'${p.id}',target:${t.target},subject:${t.subject}})">${esc(t.label)}</button>`).join("")}</div>` : ""}
    </div>`;
  }).join("");
  if (plans.some((p) => p.ambition)) html = `<p class="muted" style="margin-top:0">★ 是能推動這一代志向的計畫。</p>` + html;
  $("tab-body").innerHTML = html;
}

poll();
</script>
</body>
</html>
